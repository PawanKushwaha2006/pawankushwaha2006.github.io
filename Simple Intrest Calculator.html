
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Interest Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7f5;
    color: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    transition: 0.3s;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 28px;
    border-radius: 22px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.top h2 {
    font-size: 23px;
}

.theme {
    border: none;
    background: #f1f5f9;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
}

.input-box {
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dbe2e8;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    background: transparent;
    color: inherit;
}

input:focus {
    border-color: #ff6b35;
}

.result {
    background: #fff3eb;
    padding: 20px;
    border-radius: 16px;
    margin-top: 20px;
    text-align: center;
}

.result small {
    color: #64748b;
}

.result h1 {
    color: #ff6b35;
    font-size: 30px;
    margin: 10px 0;
    overflow-wrap: anywhere;
}

.details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
}

.detail {
    background: #f8fafc;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.detail span {
    font-size: 13px;
    color: #64748b;
}

.detail h3 {
    margin-top: 8px;
    overflow-wrap: anywhere;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button.action {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.calculate {
    background: #ff6b35;
    color: white;
}

.reset {
    background: #e2e8f0;
    color: #334155;
}

.copy {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #16a34a;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #94a3b8;
}

/* Dark mode */
body.dark {
    background: #111827;
    color: #f1f5f9;
}

body.dark .container {
    background: #1f2937;
}

body.dark input {
    border-color: #475569;
}

body.dark .theme {
    background: #334155;
    color: white;
}

body.dark .result {
    background: #3a2b24;
}

body.dark .detail {
    background: #334155;
}

body.dark .reset {
    background: #334155;
    color: white;
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <h2>Simple Interest</h2>
        <button class="theme" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="input-box">
        <label>Principal Amount (₹)</label>
        <input type="number" id="principal" placeholder="Enter amount">
    </div>

    <div class="input-box">
        <label>Interest Rate (% per year)</label>
        <input type="number" id="rate" placeholder="Enter interest rate">
    </div>

    <div class="input-box">
        <label>Time (Years)</label>
        <input type="number" id="time" placeholder="Enter time in years">
    </div>

    <div class="buttons">
        <button class="action calculate" onclick="calculate()">Calculate</button>
        <button class="action reset" onclick="resetAll()">Reset</button>
    </div>

    <div class="result">
        <small>Simple Interest</small>
        <h1 id="interest">₹0.00</h1>
    </div>

    <div class="details">
        <div class="detail">
            <span>Total Amount</span>
            <h3 id="total">₹0.00</h3>
        </div>

        <div class="detail">
            <span>Principal</span>
            <h3 id="base">₹0.00</h3>
        </div>
    </div>

    <button class="copy" onclick="copyResult()">📋 Copy Result</button>

    <div class="footer">
        Simple Interest Calculator · Made for easy calculations
    </div>

</div>

<script>
function calculate() {
    let P = parseFloat(document.getElementById("principal").value);
    let R = parseFloat(document.getElementById("rate").value);
    let T = parseFloat(document.getElementById("time").value);

    if (isNaN(P) || isNaN(R) || isNaN(T) || P < 0 || R < 0 || T < 0) {
        alert("Please enter valid positive values.");
        return;
    }

    // Simple Interest Formula
    let SI = (P * R * T) / 100;
    let total = P + SI;

    document.getElementById("interest").innerText =
        "₹" + SI.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});

    document.getElementById("total").innerText =
        "₹" + total.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});

    document.getElementById("base").innerText =
        "₹" + P.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function resetAll() {
    document.getElementById("principal").value = "";
    document.getElementById("rate").value = "";
    document.getElementById("time").value = "";

    document.getElementById("interest").innerText = "₹0.00";
    document.getElementById("total").innerText = "₹0.00";
    document.getElementById("base").innerText = "₹0.00";
}

function toggleTheme() {
    document.body.classList.toggle("dark");

    document.querySelector(".theme").innerText =
        document.body.classList.contains("dark") ? "☀️" : "🌙";
}

function copyResult() {
    let interest = document.getElementById("interest").innerText;
    let total = document.getElementById("total").innerText;
    let base = document.getElementById("base").innerText;

    let text = `Simple Interest: ${interest}\nPrincipal: ${base}\nTotal Amount: ${total}`;

    navigator.clipboard.writeText(text)
        .then(() => alert("Result copied successfully!"))
        .catch(() => alert("Unable to copy result."));
}
</script>

</body>
  </html>
