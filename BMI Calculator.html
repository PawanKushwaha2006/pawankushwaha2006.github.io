
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #151515;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 400px;
    background: #222;
    padding: 25px;
    border-radius: 18px;
}

h2 {
    text-align: center;
    color: #ff6b35;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 8px;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #555;
    border-radius: 9px;
    background: #333;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 9px;
    background: #ff6b35;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

#result {
    display: none;
    margin-top: 22px;
    padding: 18px;
    background: #333;
    border-radius: 10px;
    text-align: center;
}

#bmi {
    font-size: 40px;
    font-weight: bold;
    color: #ff6b35;
    margin: 10px;
}

#status {
    font-size: 20px;
    font-weight: bold;
    margin: 10px;
}

#details {
    color: #ccc;
    font-size: 13px;
    line-height: 1.5;
}

.note {
    color: #aaa;
    font-size: 12px;
    margin-top: 15px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

<h2>BMI Calculator</h2>

<label>Age (Years)</label>
<input type="number" id="age" placeholder="Enter your age" min="2" max="120">

<label>Height (cm)</label>
<input type="number" id="height" placeholder="Enter height">

<label>Weight (kg)</label>
<input type="number" id="weight" placeholder="Enter weight" step="any">

<label>Sex (for age-based BMI assessment)</label>
<select id="sex">
    <option value="">Select</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
</select>

<button onclick="calculateBMI()">Calculate BMI</button>

<div id="result" aria-live="polite">
    <p>Your BMI</p>
    <div id="bmi"></div>
    <div id="status"></div>
    <p id="details"></p>
</div>

<p class="note">
BMI is a screening measure, not a diagnosis.
For people under 18, BMI must be interpreted
using age- and sex-specific growth charts.
</p>

</div>

<script>
function calculateBMI() {

    const age = Number(document.getElementById("age").value);
    const height = Number(document.getElementById("height").value);
    const weight = Number(document.getElementById("weight").value);
    const sex = document.getElementById("sex").value;

    const result = document.getElementById("result");

    if (
        !age || !height || !weight || !sex ||
        age < 2 || age > 120 ||
        height <= 0 || height > 300 ||
        weight <= 0 || weight > 500
    ) {
        alert("Please enter valid age, height, weight and sex.");
        result.style.display = "none";
        return;
    }

    const heightMeter = height / 100;
    const bmiValue = weight / (heightMeter * heightMeter);

    document.getElementById("bmi").innerText =
        bmiValue.toFixed(1);

    const status = document.getElementById("status");
    const details = document.getElementById("details");

    if (age < 18) {

        status.innerText = "Age-specific assessment required";
        status.style.color = "#ffb74d";

        details.innerText =
            "For children and teenagers, BMI is assessed using BMI-for-age percentiles. A pediatric growth chart is needed for an accurate classification.";

    } else {

        let category = "";
        let color = "";

        if (bmiValue < 18.5) {
            category = "Underweight";
            color = "#64b5f6";
        }
        else if (bmiValue < 25) {
            category = "Normal Weight";
            color = "#66bb6a";
        }
        else if (bmiValue < 30) {
            category = "Overweight";
            color = "#ffb74d";
        }
        else {
            category = "Obese";
            color = "#ef5350";
        }

        status.innerText = category;
        status.style.color = color;

        details.innerText =
            "Adult BMI screening category. This is not a medical diagnosis.";
    }

    result.style.display = "block";
}
</script>

</body>
</html>
