
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fb;
    color:#1e293b;
    padding:20px;
    transition:.3s;
}

body.dark{
    background:#111827;
    color:#f1f5f9;
}

.container{
    max-width:480px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:22px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.dark .container{
    background:#1f2937;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.header h2{
    font-size:22px;
}

.theme{
    border:none;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.fraction-row{
    display:grid;
    grid-template-columns:1fr 70px 1fr;
    gap:12px;
    align-items:center;
    margin-top:18px;
}

.fraction{
    display:flex;
    flex-direction:column;
    gap:10px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #dbe2ea;
    border-radius:12px;
    font-size:18px;
    text-align:center;
    outline:none;
}

.dark input{
    background:#374151;
    color:white;
    border-color:#4b5563;
}

.line{
    height:3px;
    background:#ff6b35;
    border-radius:10px;
}

.operator{
    font-size:28px;
    font-weight:bold;
    text-align:center;
}

select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #dbe2ea;
    font-size:18px;
}

.dark select{
    background:#374151;
    color:white;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.calculate{
    background:#ff6b35;
    color:white;
}

.reset{
    background:#e5e7eb;
    color:#111827;
}

.result{
    margin-top:22px;
    padding:20px;
    background:#fff7ed;
    border-radius:16px;
    display:none;
    line-height:1.8;
}

.dark .result{
    background:#374151;
}

.result h3{
    color:#ff6b35;
    margin-bottom:10px;
}

.big{
    font-size:27px;
    font-weight:bold;
    color:#ff6b35;
    word-break:break-word;
}

.copy{
    width:100%;
    margin-top:15px;
    padding:12px;
    background:#1e293b;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>➗ Fraction Calculator</h2>
<button class="theme" onclick="toggleTheme()">🌙</button>
</div>

<div class="fraction-row">

<div class="fraction">
<input type="number" id="n1" placeholder="Numerator">
<div class="line"></div>
<input type="number" id="d1" placeholder="Denominator">
</div>

<div class="operator">
<select id="operator">
<option value="+">+</option>
<option value="-">−</option>
<option value="*">×</option>
<option value="/">÷</option>
</select>
</div>

<div class="fraction">
<input type="number" id="n2" placeholder="Numerator">
<div class="line"></div>
<input type="number" id="d2" placeholder="Denominator">
</div>

</div>

<div class="buttons">
<button class="btn calculate" onclick="calculate()">Calculate</button>
<button class="btn reset" onclick="resetAll()">Reset</button>
</div>

<div class="result" id="result"></div>

</div>

<script>

function gcd(a,b){
    a=Math.abs(a);
    b=Math.abs(b);

    while(b){
        let t=b;
        b=a%b;
        a=t;
    }

    return a;
}

function simplify(n,d){

    if(d<0){
        n=-n;
        d=-d;
    }

    let g=gcd(n,d);

    if(g===0) return {n:0,d:1};

    return {n:n/g,d:d/g};
}

function calculate(){

    let n1=parseInt(document.getElementById("n1").value);
    let d1=parseInt(document.getElementById("d1").value);
    let n2=parseInt(document.getElementById("n2").value);
    let d2=parseInt(document.getElementById("d2").value);
    let op=document.getElementById("operator").value;

    let result=document.getElementById("result");

    if(isNaN(n1)||isNaN(d1)||isNaN(n2)||isNaN(d2)){
        alert("Please enter all fraction values.");
        return;
    }

    if(d1===0||d2===0){
        alert("Denominator cannot be zero.");
        return;
    }

    let n,d;

    if(op==="+"){
        n=n1*d2+n2*d1;
        d=d1*d2;
    }
    else if(op==="-"){
        n=n1*d2-n2*d1;
        d=d1*d2;
    }
    else if(op==="*"){
        n=n1*n2;
        d=d1*d2;
    }
    else if(op==="/"){
        if(n2===0){
            alert("Cannot divide by zero.");
            return;
        }
        n=n1*d2;
        d=d1*n2;
    }

    let s=simplify(n,d);

    n=s.n;
    d=s.d;

    let decimal=n/d;

    let mixedWhole=Math.trunc(n/d);
    let remainder=Math.abs(n%d);

    let mixed="";

    if(remainder===0){
        mixed=`${mixedWhole}`;
    }
    else if(mixedWhole===0){
        mixed=`${n}/${d}`;
    }
    else{
        mixed=`${mixedWhole} ${remainder}/${d}`;
    }

    result.innerHTML=`
        <h3>📊 Result</h3>

        <div class="big">${n}/${d}</div>

        <div>Mixed Fraction: ${mixed}</div>

        <div>Decimal: ${decimal.toFixed(8).replace(/0+$/,"").replace(/\.$/,"")}</div>

        <div> Simplified: ${n}/${d}</div>

        <button class="copy" onclick="copyResult()">
        📋 Copy Result
        </button>
    `;

    result.style.display="block";
}

function resetAll(){

    document.getElementById("n1").value="";
    document.getElementById("d1").value="";
    document.getElementById("n2").value="";
    document.getElementById("d2").value="";
    document.getElementById("operator").value="+";

    document.getElementById("result").style.display="none";
}

function toggleTheme(){
    document.body.classList.toggle("dark");
}

function copyResult(){

    navigator.clipboard.writeText(
        document.getElementById("result").innerText
    )
    .then(()=>alert("Result copied successfully!"))
    .catch(()=>alert("Unable to copy result."));
}

</script>

</body>
</html>
