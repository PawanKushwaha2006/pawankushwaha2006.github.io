
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7f5;
    color: #1e293b;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    transition: .3s;
}

.container {
    width: 100%;
    max-width: 650px;
    background: white;
    padding: 28px;
    border-radius: 22px;
    box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.top h2 {
    font-size: 24px;
}

.theme {
    border: none;
    background: #f1f5f9;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
}

textarea {
    width: 100%;
    height: 220px;
    padding: 16px;
    border: 1px solid #dbe2e8;
    border-radius: 14px;
    font-size: 16px;
    resize: vertical;
    outline: none;
    background: transparent;
    color: inherit;
    line-height: 1.6;
}

textarea:focus {
    border-color: #ff6b35;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 20px;
}

.stat {
    background: #f8fafc;
    padding: 18px;
    border-radius: 15px;
}

.stat span {
    font-size: 13px;
    color: #64748b;
}

.stat h3 {
    font-size: 26px;
    margin-top: 8px;
    color: #ff6b35;
    overflow-wrap: anywhere;
}

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

.action {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.copy {
    background: #16a34a;
    color: white;
}

.clear {
    background: #e2e8f0;
    color: #334155;
}

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #94a3b8;
}

body.dark {
    background: #111827;
    color: #f1f5f9;
}

body.dark .container {
    background: #1f2937;
}

body.dark textarea {
    border-color: #475569;
}

body.dark .theme {
    background: #334155;
    color: white;
}

body.dark .stat {
    background: #334155;
}

body.dark .clear {
    background: #334155;
    color: white;
}

@media(max-width:400px) {
    .stats {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <h2>Word Counter</h2>
        <button class="theme" onclick="toggleTheme()">🌙</button>
    </div>

    <textarea id="text" placeholder="Start typing or paste your text here..."></textarea>

    <div class="stats">

        <div class="stat">
            <span>Words</span>
            <h3 id="words">0</h3>
        </div>

        <div class="stat">
            <span>Characters</span>
            <h3 id="characters">0</h3>
        </div>

        <div class="stat">
            <span>Characters (No Spaces)</span>
            <h3 id="noSpaces">0</h3>
        </div>

        <div class="stat">
            <span>Sentences</span>
            <h3 id="sentences">0</h3>
        </div>

        <div class="stat">
            <span>Paragraphs</span>
            <h3 id="paragraphs">0</h3>
        </div>

        <div class="stat">
            <span>Reading Time</span>
            <h3 id="reading">0 min</h3>
        </div>

    </div>

    <div class="buttons">
        <button class="action copy" onclick="copyText()">📋 Copy Text</button>
        <button class="action clear" onclick="clearText()">🗑 Clear</button>
    </div>

    <div class="footer">
        Word Counter · Analyze your text instantly
    </div>

</div>

<script>
const textArea = document.getElementById("text");

textArea.addEventListener("input", countText);

function countText() {
    let text = textArea.value;

    // Word count
    let words = text.trim() === "" ? 0 :
        text.trim().split(/\s+/u).length;

    // Character count
    let characters = text.length;

    // Characters without spaces
    let noSpaces = text.replace(/\s/g, "").length;

    // Sentence count
    let sentences = text.trim() === "" ? 0 :
        (text.match(/[.!?]+(?=\s|$)/g) || []).length;

    // Paragraph count
    let paragraphs = text.trim() === "" ? 0 :
        text.trim().split(/\n\s*\n/).filter(p => p.trim()).length;

    // Reading time (average 200 words per minute)
    let readingTime = words === 0 ? 0 :
        Math.ceil(words / 200);

    document.getElementById("words").innerText = words;
    document.getElementById("characters").innerText = characters;
    document.getElementById("noSpaces").innerText = noSpaces;
    document.getElementById("sentences").innerText = sentences;
    document.getElementById("paragraphs").innerText = paragraphs;
    document.getElementById("reading").innerText =
        readingTime + (readingTime === 1 ? " min" : " min");
}

function copyText() {
    if (!textArea.value) {
        alert("Nothing to copy.");
        return;
    }

    navigator.clipboard.writeText(textArea.value)
        .then(() => alert("Text copied successfully!"))
        .catch(() => alert("Unable to copy text."));
}

function clearText() {
    textArea.value = "";
    countText();
}

function toggleTheme() {
    document.body.classList.toggle("dark");

    document.querySelector(".theme").innerText =
        document.body.classList.contains("dark") ? "☀️" : "🌙";
}
</script>

</body>
          </html>
