<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi Phone Speaker</title>
<style>
:root{--bg:#eef3f4;--ink:#12242b;--mut:#5b6e75;--card:#fff;--acc:#0b7f86;--acc-ink:#fff;--line:#d3dde0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1e;--ink:#e6f0f2;--mut:#8ea5ac;--card:#162a30;--acc:#3cc4cb;--acc-ink:#062226;--line:#274149}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:20px;max-width:480px;margin-inline:auto}
h1{font-size:26px;margin:8px 0 4px}
p{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
button{font:inherit;font-weight:600;background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:12px 16px;width:100%;margin-top:10px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
input[type=file]{width:100%;margin-top:8px}
#qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:8px;margin-top:10px}
#status{font-size:14px;color:var(--mut);margin-top:8px;word-break:break-all}
.hide{display:none}
</style>
</head>
<body>
<h1>Multi Phone Speaker</h1>
<p>Ek phone se audio, kai phones par.</p>

<!-- HOST -->
<div id="host" class="hide">
  <div class="card">
    <b>1. Dusre phones ko jodo</b>
    <div id="qr"></div>
    <div id="status">Connecting…</div>
    <div id="count">Connected phones: 0</div>
  </div>
  <div class="card">
    <b>2. Audio chuno</b>
    <input type="file" id="file" accept="audio/*">
    <button id="tab" class="alt">Tab / screen audio share karo (desktop Chrome)</button>
    <audio id="player" controls style="width:100%;margin-top:10px"></audio>
  </div>
</div>

<!-- GUEST -->
<div id="guest" class="hide">
  <div class="card">
    <b>Host se jud rahe hain…</b>
    <div id="gstatus">Connecting…</div>
    <button id="join">Sound chalu karo</button>
    <audio id="out" autoplay playsinline></audio>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const room = new URLSearchParams(location.search).get('join');

if (!room) startHost(); else startGuest(room);

function startHost() {
  $('host').classList.remove('hide');
  const peer = new Peer();
  const guests = new Set();
  let stream = null;

  const lowLatency = sdp => sdp.replace('useinbandfec=1',
    'useinbandfec=1;minptime=10;maxptime=20;stereo=1;sprop-stereo=1;maxaveragebitrate=128000');
  const callGuest = id => { if (stream) peer.call(id, stream, { sdpTransform: lowLatency }); };
  const refresh = () => $('count').textContent = 'Connected phones: ' + guests.size;

  peer.on('open', id => {
    const url = location.href.split('?')[0] + '?join=' + id;
    new QRCode($('qr'), { text: url, width: 200, height: 200 });
    $('status').textContent = 'Dusre phone se QR scan karo, ya link kholo: ' + url;
  });
  peer.on('error', e => $('status').textContent = 'Error: ' + e.type);

  peer.on('connection', conn => {
    conn.on('open', () => { guests.add(conn.peer); refresh(); callGuest(conn.peer); });
    conn.on('close', () => { guests.delete(conn.peer); refresh(); });
  });

  const setStream = s => { stream = s; guests.forEach(callGuest); };

  $('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const p = $('player');
    p.src = URL.createObjectURL(f);
    p.onplay = () => {
      const cap = p.captureStream || p.mozCaptureStream;
      if (cap && !stream) setStream(cap.call(p));
    };
    p.play().catch(() => {});
  };

  $('tab').onclick = async () => {
    try {
      const d = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const tracks = d.getAudioTracks();
      if (!tracks.length) return alert('Audio share nahi hua. "Share tab audio" tick karo.');
      setStream(new MediaStream(tracks));
    } catch (err) { alert('Share nahi ho paya: ' + err.message); }
  };
}

function startGuest(hostId) {
  $('guest').classList.remove('hide');
  const peer = new Peer();
  peer.on('open', () => {
    const conn = peer.connect(hostId);
    conn.on('open', () => $('gstatus').textContent = 'Jud gaye. Host audio start karega to sound aayega.');
    conn.on('close', () => $('gstatus').textContent = 'Host se connection toot gaya.');
  });
  peer.on('call', call => {
    call.answer();
    call.on('stream', s => {
      call.peerConnection.getReceivers().forEach(r => {
        try { r.jitterBufferTarget = 0; } catch (e) {}
        try { r.playoutDelayHint = 0; } catch (e) {}
      });
      $('out').srcObject = s;
      $('out').play().catch(() => {});
      $('gstatus').textContent = 'Sound chal raha hai.';
    });
  });
  peer.on('error', e => $('gstatus').textContent = 'Error: ' + e.type);
  // Browser ko autoplay ke liye ek tap chahiye
  $('join').onclick = () => { $('out').play().catch(() => {}); $('join').classList.add('hide'); };
}
</script>
</body>
</html>
