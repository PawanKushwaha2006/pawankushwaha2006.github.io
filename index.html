<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
  }

  #naughtyAiBtn {
    position: relative;
    background: rgba(255, 255, 255, 0.08); /* glass colour */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    padding: 16px 32px;
    border-radius: 40px;
    font-size: 19px;
    font-weight: 900;
    cursor: pointer;
    text-decoration: none;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 10px rgba(255,255,255,0.2);
  }

  /* Diamond jaisi chamak jo chalti rahegi */
  #naughtyAiBtn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.8), transparent);
    animation: shine 2.5s infinite;
  }

  @keyframes shine {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  #naughtyAiBtn:hover {
    box-shadow: 0 0 35px rgba(250, 45, 72, 0.8), 0 0 15px #fff;
    transform: scale(1.05);
  }
</style>
</head>
<body>

<a id="naughtyAiBtn" href="#" onclick="openPydroid()"> Open Naughty Ai 🤖</a>

<script>
function openPydroid(){
  window.location.href = "intent://#Intent;package=ru.iiec.NaughtyAI;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
  setTimeout(()=>{
    window.location.href = "https://play.google.com/store/apps/details?id=ru.iiec.Naughty AI";
  }, 1500);
}
</script>

</body>
</html>
