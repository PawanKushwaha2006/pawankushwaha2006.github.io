<!DOCTYPE html>
<html>
<head>
<title>CodeNix AI</title>
<style>
body{background:black;color:white;font-family:sans-serif;text-align:center;padding:20px}
#box{width:90%;max-width:500px;margin:auto;background:#222;padding:20px;border-radius:15px}
input,button{padding:12px;width:90%;margin:10px;border-radius:10px;border:none;font-size:16px}
button{background:#00ff99;font-weight:bold}
#ans{background:#111;padding:15px;border-radius:10px;text-align:left;min-height:100px;margin-top:10px}
</style>
</head>
<body>
<h1>🤖 CodeNix AI</h1>
<p>Ab mai ChatGPT jaisa jawab dunga!</p>

<div id="box">
<input id="q" placeholder="Kuch bhi pucho...">
<button onclick="ask()">Pucho</button>
<div id="ans">Yahan jawab aayega...</div>
</div>

<script>
// --- YAHAN CHABI DALO ---
const API_KEY = "AQ.Ab8RN6LJtg2LVSToxIE8n0PVK0yp4 m6c9P6zSVaSGkrHJDalYw";
// -------------------------

async function ask(){
let q = document.getElementById("q").value;
document.getElementById("ans").innerHTML = "Soch raha hu...";
let url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + API_KEY;

let res = await fetch(url, {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({contents:[{parts:[{text:q}]}]})
});

let data = await res.json();
try{
document.getElementById("ans").innerHTML = data.candidates[0].content.parts[0].text;
} catch(e){
document.getElementById("ans").innerHTML = "Error! Chabi galat hai ya net slow hai";
}
}
</script>
</body>
</html>
