<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeNix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0d1117; 
            color: #e6edf3; 
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        header { text-align: center; padding: 4rem 0; }
        .logo { 
            font-size: 4rem; 
            font-weight: 800; 
            background: linear-gradient(45deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        .tagline { font-size: 1.3rem; color: #8b949e; margin-bottom: 2rem; }
        .btn {
            display: inline-block;
            background: #238636;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        footer { text-align: center; padding: 2rem 0; color: #8b949e; border-top: 1px solid #30363d; margin-top: 4rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">CodeNix</div>
            <p class="tagline">Code • Create • Conquer</p>
            <p>Welcome to CodeNix. Let's build something amazing.</p>
            <br>
            <a href="#" class="btn">Get Started</a>
        </header>

        <footer>
            <p>© 2026 CodeNix</p>
        </footer>
    </div>
</body>
</html>
