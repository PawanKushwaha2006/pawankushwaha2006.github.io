<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Speaker Fixed</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;display:flex;justify-content:center;padding:12px;min-height:100vh}
.card{width:100%;max-width:430px;background:#141414;border-radius:20px;padding:16px;border:1px solid #222}
.btn{width:100%;padding:13px;border:none;border-radius:11px;font-weight:800;margin-top:8px;cursor:pointer}
.host{background:#fff;color:#000}.guest{background:#222;color:#fff;border:1px solid #333}
.qr{background:#fff;border-radius:14px;min-height:220px;display:flex;justify-content:center;align-items:center;margin:10px 0;padding:10px}
#qrcode img{margin:auto}
.stat{font-size:11px;background:#0e0e0e;padding:8px;border-radius:8px;margin-top:8px;color:#888}
.file{display:none;border:2px dashed #2a2a2a;border-radius:12px;padding:12px;margin-top:10px}
audio{width:100%;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">🔊 QR Speaker - Fixed</h2>
<p style="font-size:11px;color:#666;text-align:center;margin:6px 0">Max 10 Phone</p>

<button class="btn host" id="hostBtn">📱 HOST BANO - QR BANAO</button>
<button class="btn guest" id="scanBtn">📷 QR SCAN KARO</button>

<div id="reader" style="display:none;margin-top:10px"></div>

<div class="file" id="fileBox">
<button class="btn host" id="sysBtn" style="background:#1DB954;color:#fff">▶️ System Audio Lo (Youtube/Spotify Web)</button>
<label class="btn guest" style="display:flex;justify-content:center;align-items:center">📁 Downloaded MP3<input type="file" id="mp3" accept="audio/*" hidden></label>
<audio id="mainAudio" controls></audio>
<p style="font-size:9px;color:#555;margin-top:5px">Spotify App ka sound lena hai to isi browser me open.spotify.com kholo</p>
</div>

<div class="qr" id="qr"><div id="qrcode"></div></div>
<div class="stat" id="status">Status: Ready - HOST dabao</div>
<div id="list" style="font-size:12px;color:#0f0;margin-top:6px"></div>
<audio id="guestAudio" autoplay controls style="display:none;width:100%"></audio>
</div>

<script>
let peer, localStream;
let connected = {};
const MAX = 10;
const status = t => document.getElementById('status').innerText = t;
const mainAudio = document.getElementById('mainAudio');
const guestAudio = document.getElementById('guestAudio');
const qrcodeDiv = document.getElementById('qrcode');
const list = document.getElementById('list');

function updateList(){
  const c = Object.keys(connected).length;
  list.innerHTML = `Connected ${c}/${MAX} ${c>=MAX?'(FULL)':''}<br>`+Object.keys(connected).map(k=>`✅ ${k.slice(0,6)}`).join('<br>');
}

// HOST
document.getElementById('hostBtn').onclick = () => {
  status("Peer ID bana raha hu... thoda wait karo (Internet chahiye)");
  qrcodeDiv.innerHTML = "Generating...";

  peer = new Peer({ config: {'iceServers': [{urls:'stun:stun.l.google.com:19302'}] }});

  peer.on('open', id => {
    status("Host Ready: " + id);
    qrcodeDiv.innerHTML = "";
    const link = location.href.split('?')[0] + "?join=" + id;

    // FIXED QR GENERATION
    new QRCode(qrcodeDiv, {
      text: link,
      width: 200,
      height: 200,
      colorDark: "#000",
      colorLight: "#fff",
      correctLevel: QRCode.CorrectLevel.H
    });

    // Link bhi dikhao backup ke liye
    const p = document.createElement('p');
    p.style.cssText = "color:#000;font-size:9px;word-break:break-all;margin-top:6px;text-align:center";
    p.innerText = link;
    qrcodeDiv.appendChild(p);

    document.getElementById('fileBox').style.display='block';
  });

  peer.on('error', err => {
    status("Error: " + err.type + " - Net check karo");
    console.log(err);
  });

  peer.on('connection', conn => {
    if(Object.keys(connected).length >= MAX){
      conn.on('open', ()=>{ conn.send({type:'full'}); conn.close(); });
      return;
    }
    connected[conn.peer] = conn;
    updateList();
    conn.on('close', ()=>{ delete connected[conn.peer]; updateList(); });
    if(localStream) setTimeout(()=> peer.call(conn.peer, localStream), 500);
  });
};

async function broadcast(){
  for(let id in connected){ try{ peer.call(id, localStream); }catch(e){} }
}

document.getElementById('sysBtn').onclick = async () => {
  try{
    localStream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
    status("System audio le liya! Ab sab me bajega");
    broadcast();
  }catch(e){ alert("Share Audio ON karna hai"); }
};

document.getElementById('mp3').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  mainAudio.src = URL.createObjectURL(f);
  mainAudio.play();
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const src = ctx.createMediaElementSource(mainAudio);
  const dest = ctx.createMediaStreamDestination();
  src.connect(dest); src.connect(ctx.destination);
  localStream = dest.stream;
  broadcast();
  status("Playing: " + f.name);
};

// SCAN & JOIN
document.getElementById('scanBtn').onclick = () => {
  const r = document.getElementById('reader');
  r.style.display='block';
  const qr = new Html5Qrcode("reader");
  qr.start({facingMode:"environment"}, {fps:10, qrbox:250},
    d => {
      qr.stop(); r.style.display='none';
      const jid = d.includes('join=')? d.split('join=')[1] : d;
      join(jid.trim());
    }
  );
};

function join(hostId){
  status("Joining " + hostId.slice(0,6));
  peer = new Peer();
  peer.on('open', ()=>{
    const conn = peer.connect(hostId);
    conn.on('data', d=>{ if(d.type==='full') alert("10 limit full"); });
  });
  peer.on('call', call=>{
    call.answer();
    call.on('stream', s=>{
      guestAudio.srcObject = s;
      guestAudio.style.display='block';
      guestAudio.play();
      document.getElementById('qr').innerHTML = "<h3 style='color:#000'>🔊 Speaker ON</h3>";
      status("Host se baj raha hai");
    });
  });
}

const jid = new URLSearchParams(location.search).get('join');
if(jid) join(jid);
</script>
</body>
  </html>
