<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--rose:#ff4d79;--deep:#c9184a;--ink:#3a0f24;--soft:#fff0f4}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Poppins','Segoe UI',sans-serif;
  background:radial-gradient(circle at 20% 15%,#ff8fab 0,transparent 45%),
             radial-gradient(circle at 85% 85%,#b5179e 0,transparent 50%),
             linear-gradient(160deg,#590d22,#a4133c 55%,#ff758f);
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0}
.card{
  position:relative;z-index:1;
  width:90%;max-width:370px;
  padding:34px 24px 26px;
  text-align:center;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.4);
  border-radius:32px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 25px 60px rgba(60,0,20,.45),inset 0 1px 0 rgba(255,255,255,.5);
  animation:rise .9s cubic-bezier(.2,.9,.3,1.1) both;
  overflow:hidden;
}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}}
#gif{font-size:58px;margin-bottom:10px;display:inline-block;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
h1{
  font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;
  font-size:36px;color:#fff;margin-bottom:10px;
  text-shadow:0 3px 18px rgba(90,0,30,.5);
}
#question{color:#ffe3ea;font-size:17px;line-height:1.5;margin-bottom:6px}
.btn-area{position:relative;height:150px;width:100%;margin-top:14px;display:flex;justify-content:center;align-items:flex-start;gap:12px}
button{
  position:absolute;border:none;border-radius:40px;
  padding:14px 30px;font:600 16px 'Poppins',sans-serif;cursor:pointer;
  transition:all .35s cubic-bezier(.3,1.3,.5,1);
}
#yesBtn{
  left:14%;top:14px;color:#fff;
  background:linear-gradient(135deg,#ff4d79,#c9184a);
  box-shadow:0 10px 25px rgba(201,24,74,.55),0 0 0 4px rgba(255,255,255,.18);
  animation:glow 2s ease-in-out infinite;
}
@keyframes glow{50%{box-shadow:0 10px 32px rgba(255,77,121,.85),0 0 0 9px rgba(255,255,255,.08)}}
#noBtn{
  left:58%;top:14px;color:#fff;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.45);
  backdrop-filter:blur(6px);
}
#proposeBox{display:none}
#proposeBox .frame{
  padding:8px;background:#fff;border-radius:22px;
  box-shadow:0 14px 35px rgba(60,0,20,.4);
  transform:rotate(-2deg);
  animation:pop .8s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{from{opacity:0;transform:rotate(-8deg) scale(.6)}}
#proposeBox img{width:100%;border-radius:16px;display:block}
#proposeBox h2{
  font-family:'Playfair Display',Georgia,serif;font-style:italic;
  color:#fff;font-size:26px;margin-top:20px;text-shadow:0 3px 14px rgba(90,0,30,.5);
}
#proposeBox p{color:#ffe3ea;font-size:14px;margin-top:6px}
#toast{
  position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;
  transform:translateX(-50%) translateY(-160px);
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.96);color:var(--ink);
  padding:15px 26px;border-radius:50px;
  font-weight:600;font-size:16px;white-space:nowrap;max-width:94vw;
  border:2px solid #ffb3c6;
  box-shadow:0 14px 40px rgba(60,0,20,.4);
  z-index:9999;opacity:0;
  transition:transform .6s cubic-bezier(.68,-.55,.27,1.55),opacity .4s;
  touch-action:pan-y;user-select:none;cursor:grab;
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.swipe-out{transform:translateX(150%) translateY(0);opacity:0}
</style>
</head>

<canvas id="hearts"></canvas>
<div id="toast">💖 Thank you so much! 😁</div>

<script>
const noBtn=document.getElementById('noBtn'),
      yesBtn=document.getElementById('yesBtn'),
      btnArea=document.getElementById('btnArea'),
      toast=document.getElementById('toast');
let noCount=0,toastTimer;const maxClicks=8;

function moveNo(){
  if(noBtn.style.display==='none')return;
  noCount++;
  const w=btnArea.clientWidth-noBtn.offsetWidth,
        h=btnArea.clientHeight-noBtn.offsetHeight;
  noBtn.style.left=Math.floor(Math.random()*w)+'px';
  noBtn.style.top=Math.floor(Math.random()*h)+'px';
  const maxYesScale = 1.35;
  let ys = Math.min(1 + noCount * 0.08, maxYesScale);
  let ns = Math.max(0.4, 1 - noCount * 0.11);
  yesBtn.style.transform=`scale(${ys})`;
  noBtn.style.transform=`scale(${ns})`;
  if(noCount>=maxClicks){
    noBtn.style.display='none';
    yesBtn.style.left='50%';yesBtn.style.top='50%';
    yesBtn.style.transform=`translate(-50%,-50%) scale(${maxYesScale})`;
    yesBtn.innerText=Please say yes to me. 🥺❤️';
    yesBtn.style.width='80%';
  }
}

function playNotifySound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ac=new AC();
    if(ac.state==='suspended')ac.resume();
    [[1318.5,0],[1760,0.14]].forEach(([freq,delay])=>{
      const t=ac.currentTime+delay;
      const o=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=freq;
      o2.type='triangle'; o2.frequency.value=freq*2;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
      o.connect(g); o2.connect(g); g.connect(ac.destination);
      o.start(t); o2.start(t); o.stop(t+0.75); o2.stop(t+0.75);
    });
    setTimeout(()=>ac.close(),1500);
  }catch(e){}
}

function yesClicked(){
  // GMAIL PE YES BHEJEGA - p.kushwaha.200600@gmail.com
  fetch("https://formsubmit.co/ajax/p.kushwaha.200600@gmail.com", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
          subject: "YES mil gaya! ❤️ - Proposal Accepted",
          name: "Proposal Website",
          message: "Kisi ne YES bol diya hai! 🥰\n\nTime: " + new Date().toLocaleString() + "\nPage Link: " + window.location.href
      })
  }).then(r => console.log("Mail sent")).catch(e => console.log("Mail error", e));

  toast.classList.remove('swipe-out');toast.classList.add('show');
  playNotifySound();
  if(navigator.vibrate)navigator.vibrate(200);
  ['gif','mainTitle','question','btnArea'].forEach(i=>document.getElementById(i).style.display='none');
  document.getElementById('proposeBox').style.display='block';
  burst();
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),8000);
}

noBtn.addEventListener('pointerenter',moveNo);
noBtn.addEventListener('mouseover',moveNo);
noBtn.addEventListener('touchstart',e=>{e.preventDefault();moveNo()},{passive:false});
noBtn.addEventListener('click',e=>{e.preventDefault();moveNo()});

let sx=0,cx=0,drag=false;
toast.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;drag=true;toast.style.transition='none'});
toast.addEventListener('touchmove',e=>{if(!drag)return;cx=e.touches[0].clientX-sx;if(cx>0)toast.style.transform=`translateX(calc(-50% + ${cx}px)) translateY(0)`});
toast.addEventListener('touchend',()=>{
  drag=false;toast.style.transition='transform .4s ease,opacity .4s';
  if(cx>80){toast.classList.add('swipe-out');toast.classList.remove('show');clearTimeout(toastTimer)}
  else toast.style.transform='translateX(-50%) translateY(0)';
  cx=0;
});

const cv=document.getElementById('hearts'),ctx=cv.getContext('2d');
let W,H,P=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',size);size();
const glyphs=['❤','💗','💖','💕','✨'];
function spawn(x,y,burst){
  P.push({
    x:x??Math.random()*W, y:y??H+20,
    s:burst?14+Math.random()*18:10+Math.random()*22,
    vx:burst?(Math.random()-.5)*9:(Math.random()-.5)*.6,
    vy:burst?-4-Math.random()*9:-.5-Math.random()*1.1,
    g:burst?.18:0, a:burst?1:.18+Math.random()*.35,
    r:Math.random()*6, vr:(Math.random()-.5)*.04,
    t:glyphs[Math.floor(Math.random()*glyphs.length)], life:burst?1:null
  });
}
function burst(){for(let i=0;i<70;i++)spawn(W/2,H*.55,true)}
for(let i=0;i<14;i++){spawn();P[P.length-1].y=Math.random()*H}
function tick(){
  ctx.clearRect(0,0,W,H);
  if(Math.random()<.06)spawn();
  P=P.filter(p=>p.y>-40&&p.y<H+60&&(p.life===null||p.life>0));
  for(const p of P){
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    if(p.life!==null)p.life-=.007;
    ctx.save();
    ctx.globalAlpha=p.life!==null?Math.max(0,p.life):p.a;
    ctx.translate(p.x,p.y);ctx.rotate(Math.sin(p.r)*.4);
    ctx.font=p.s+'px serif';ctx.textAlign='center';
    ctx.fillText(p.t,0,0);ctx.restore();
  }
  requestAnimationFrame(tick);
}
tick();
</script>
