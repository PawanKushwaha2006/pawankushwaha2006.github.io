<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
  }

  #naughtyAiBtn {
    position: relative;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    padding: 16px 32px;
    border-radius: 40px;
    font-size: 19px;
    font-weight: 900;
    cursor: pointer;
    text-decoration: none;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 10px rgba(255,255,255,0.2);
  }

  #naughtyAiBtn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.8), transparent);
    animation: shine 2.5s infinite;
  }

  @keyframes shine {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  #naughtyAiBtn:hover {
    box-shadow: 0 0 35px rgba(250, 45, 72, 0.8), 0 0 15px #fff;
    transform: scale(1.05);
  }
</style>
</head>
<body>

<a id="naughtyAiBtn" href="#" onclick="openNaughtyAI()"> Open Naughty Ai 🤖</a>

<script>
function openNaughtyAI(){
  // Naughty AI.py ko Pydroid 3 me open karega
  // File ka naam: Naughty AI.py
  
  // Method 1: Direct file ko Pydroid 3 se kholna
  window.location.href = "intent:///storage/emulated/0/Download/Naughty%20AI.py#Intent;scheme=file;action=android.intent.action.VIEW;package=ru.iiec.pydroid3;type=text/x-python;end";

  // Agar file Download folder me nahi mili to internal storage me try karo
  setTimeout(function(){
    window.location.href = "intent:///storage/emulated/0/Naughty%20AI.py#Intent;scheme=file;action=android.intent.action.VIEW;package=ru.iiec.pydroid3;type=text/x-python;end";
  }, 1000);

  // Agar fir bhi na khule to sirf Pydroid 3 open kar do
  setTimeout(function(){
    window.location.href = "intent://#Intent;package=ru.iiec.pydroid3;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
  }, 2000);
}
</script>

</body>
</html>
