<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMusic - Fix Upload</title>
<style>
*{box-sizing:border-box} body{margin:0; background:#000; color:#fff; font-family:system-ui; padding-bottom:110px;}
header{background:linear-gradient(90deg,#fa2d48,#a855f7); padding:14px 16px; display:flex; justify-content:space-between; align-items:center;}
header b{font-size:20px}
header button{background:#fff; color:#000; border:none; padding:6px 12px; border-radius:20px; font-weight:800; cursor:pointer}
#auth{max-width:360px; margin:40px auto; background:#111; padding:20px; border-radius:16px; text-align:center;}
#auth input{width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #333; background:#222; color:#fff;}
#auth button{width:100%; padding:12px; border:none; border-radius:10px; background:#fa2d48; color:#fff; font-weight:900; margin-top:8px; cursor:pointer;}
#app{display:none; padding:12px;}
.uploadBox{background:#111; border:2px dashed #444; border-radius:16px; padding:20px; text-align:center; margin-bottom:12px;}
.uploadBox label{background:#fa2d48; padding:10px 18px; border-radius:20px; font-weight:800; cursor:pointer; display:inline-block;}
.song{background:#111; border-radius:12px; padding:10px; display:flex; gap:12px; align-items:center; margin-bottom:10px;}
.song img{width:56px; height:56px; border-radius:10px; background:linear-gradient(45deg,#fa2d48,#a855f7); object-fit:cover;}
.song .t{flex:1; min-width:0}
.song .t b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.song .t span{font-size:12px; opacity:.6}
.playBtn{width:44px; height:44px; border-radius:50%; border:none; background:#fff; font-size:18px; cursor:pointer;}
#status{text-align:center; color:yellow; font-size:13px; padding:8px;}
#player{position:fixed; bottom:0; left:0; right:0; background:#111; border-top:1px solid #333; padding:10px 14px; display:none; z-index:10;}
#playerTop{display:flex; align-items:center; gap:10px;}
#player img{width:48px; height:48px; border-radius:8px;}
#progress{flex:1; height:6px; background:#333; border-radius:10px; overflow:hidden;}
#progress div{height:100%; background:#fa2d48; width:0%}
#volControls{display:flex; gap:10px; justify-content:center; margin-top:10px;}
#volControls button{flex:1; padding:12px; border:none; border-radius:12px; font-weight:800; cursor:pointer; background:#222; color:#fff; border:1px solid #333;}
</style>
</head>
<body>
<header><b>🎵 MyMusic</b> <span id="userName"></span><button id="logoutBtn" onclick="logout()" style="display:none">Logout</button></header>
<div id="auth">
<h2>Account Banao / Login</h2>
<input id="nameInp" placeholder="Apna Naam">
<input id="emailInp" placeholder="Email / Username">
<input id="passInp" type="password" placeholder="Password">
<button onclick="signup()">SIGN UP</button>
<button onclick="login()" style="background:#fff; color:#000;">LOGIN</button>
</div>
<div id="app">
<div class="uploadBox">
<h3>Gaana Upload Karo</h3>
<label for="fileInp">+ Gaana Select Karo</label>
<input type="file" id="fileInp" accept="audio/*,.mp3,.m4a,.wav" onchange="uploadSong(event)" style="display:none">
<div id="status"></div>
<p style="opacity:.6; font-size:12px;">Ab 50MB tak ka gaana bhi chalega</p>
</div>
<h3>🌍 Sabke Gaane</h3>
<div id="songs"></div>
</div>
<div id="player">
<div id="playerTop">
<img id="pImg" src="https://picsum.photos/100/100">
<div style="flex:1; min-width:0;"><b id="pTitle">Song</b><div id="progress" onclick="seek(event)"><div id="bar"></div></div></div>
<button class="playBtn" onclick="togglePlay()">▶</button>
</div>
<div id="volControls"><button id="volDown">🔉 VOL -<br><small>dabake rakho = prev</small></button><button id="volUp">🔊 VOL +<br><small>dabake rakho = next</small></button></div>
</div>
<audio id="audio" ontimeupdate="onTime()"></audio>
<script>
// IndexedDB - Bada storage
let db;
let dbReq=indexedDB.open('MyMusicDB',1);
dbReq.onupgradeneeded=e=>{ db=e.target.result; if(!db.objectStoreNames.contains('songs')) db.createObjectStore('songs',{keyPath:'id', autoIncrement:true}); };
dbReq.onsuccess=e=>{ db=e.target.result; loadApp(); };
dbReq.onerror=e=>{ alert('Database nahi khula: '+e.target.error); };

const authEl=document.getElementById('auth');
const appEl=document.getElementById('app');
const songsEl=document.getElementById('songs');
const statusEl=document.getElementById('status');
let currentUser=null, currentSongIndex=-1, allSongs=[];

function getUsers(){ return JSON.parse(localStorage.getItem('myMusicUsers')||'[]'); }
function saveUsers(u){ localStorage.setItem('myMusicUsers', JSON.stringify(u)); }

function signup(){
 let name=document.getElementById('nameInp').value.trim();
 let email=document.getElementById('emailInp').value.trim();
 let pass=document.getElementById('passInp').value.trim();
 if(!name||!email||!pass){ alert('Sab bharo'); return; }
 let users=getUsers();
 if(users.find(u=>u.email==email)){ alert('Account pehle se hai'); return; }
 users.push({name,email,pass}); saveUsers(users);
 localStorage.setItem('currentUser', email); loadApp();
}
function login(){
 let email=document.getElementById('emailInp').value.trim();
 let pass=document.getElementById('passInp').value.trim();
 let u=getUsers().find(u=>u.email==email && u.pass==pass);
 if(!u){ alert('Email ya password galat hai'); return; }
 localStorage.setItem('currentUser', email); loadApp();
}
function logout(){ localStorage.removeItem('currentUser'); location.reload(); }
function loadApp(){
 let email=localStorage.getItem('currentUser'); if(!email) return;
 currentUser=getUsers().find(u=>u.email==email); if(!currentUser) return;
 authEl.style.display='none'; appEl.style.display='block';
 document.getElementById('logoutBtn').style.display='block';
 document.getElementById('userName').innerText='Hi, '+currentUser.name;
 renderSongs();
}

// Upload - ab File ko direct save karega, base64 nahi
function uploadSong(e){
 let file=e.target.files[0]; if(!file) return;
 statusEl.innerText='Upload ho raha hai... '+file.name+' ('+Math.round(file.size/1024/1024*10)/10+' MB)';
 console.log('File type:', file.type, 'Size:', file.size);
 if(file.size>50*1024*1024){ alert('Gaana 50MB se bada hai'); statusEl.innerText=''; return; }

 let tx=db.transaction('songs','readwrite');
 let store=tx.objectStore('songs');
 let req=store.add({name:file.name.replace('.mp3','').replace('.m4a',''), size:Math.round(file.size/1024)+' KB', file:file, uploader:currentUser.name, uploaderEmail:currentUser.email, time:new Date().toLocaleString()});
 req.onsuccess=()=>{ statusEl.innerText='✅ Upload ho gaya!'; renderSongs(); setTimeout(()=>statusEl.innerText='',2000); };
 req.onerror=(ev)=>{ statusEl.innerText='❌ Error: '+ev.target.error; alert('Upload fail: '+ev.target.error); };
}

function renderSongs(){
 let tx=db.transaction('songs','readonly');
 let store=tx.objectStore('songs');
 let req=store.getAll();
 req.onsuccess=()=>{
  allSongs=req.result;
  if(!allSongs.length){ songsEl.innerHTML='<p style="opacity:.5">Abhi koi gaana nahi hai. Tum pehla upload karo.</p>'; return; }
  songsEl.innerHTML='';
  allSongs.forEach((s,i)=>{
   let div=document.createElement('div'); div.className='song';
   let deleteBtn='';
   if(s.uploaderEmail===currentUser.email) deleteBtn=`<button onclick="deleteSong(${s.id})" style="background:#ef4444; color:#fff; border:none; padding:8px; border-radius:8px;">🗑</button>`;
   div.innerHTML=`<img src="https://picsum.photos/100/100?random=${s.id}"><div class="t"><b>${s.name}</b><span>👤 ${s.uploader} • ${s.size}</span></div><button class="playBtn" onclick="playSong(${i})">▶</button>${deleteBtn}`;
   songsEl.appendChild(div);
  });
 };
}
function deleteSong(id){
 if(!confirm('Pakka delete karna hai?')) return;
 let tx=db.transaction('songs','readwrite');
 tx.objectStore('songs').delete(id);
 tx.oncomplete=renderSongs;
}
const audio=document.getElementById('audio');
function playSong(i){
 let s=allSongs[i]; currentSongIndex=i;
 audio.src=URL.createObjectURL(s.file); audio.play();
 document.getElementById('player').style.display='block';
 document.getElementById('pTitle').innerText=s.name+' - '+s.uploader;
}
function togglePlay(){ if(audio.paused) audio.play(); else audio.pause(); }
function onTime(){ if(!audio.duration) return; document.getElementById('bar').style.width=(audio.currentTime/audio.duration*100)+'%'; }
function seek(e){ let rect=document.getElementById('progress').getBoundingClientRect(); audio.currentTime=audio.duration*((e.clientX-rect.left)/rect.width); }
function nextSong(){ if(!allSongs.length) return; currentSongIndex=(currentSongIndex+1)%allSongs.length; playSong(currentSongIndex); }
function prevSong(){ if(!allSongs.length) return; currentSongIndex=(currentSongIndex-1+allSongs.length)%allSongs.length; playSong(currentSongIndex); }
let volLongTimer=null;
function setupVol(id,isUp){
 let btn=document.getElementById(id);
 btn.addEventListener('pointerdown', ()=>{ volLongTimer=setTimeout(()=>{ if(isUp) nextSong(); else prevSong(); volLongTimer=null; },600); });
 btn.addEventListener('pointerup', ()=>{ if(volLongTimer){ clearTimeout(volLongTimer); audio.volume=Math.min(1,Math.max(0,audio.volume+(isUp?0.1:-0.1))); } });
}
setupVol('volUp',true); setupVol('volDown',false);
</script>
</body>
</html>
