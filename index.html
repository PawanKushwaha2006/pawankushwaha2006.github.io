<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Assistant</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#e8e8ea;--mut:#8b8f98;--acc:#6ea8fe;--ok:#3ddc97;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#25406b}
.a{align-self:flex-start;background:var(--card)}
.t{align-self:flex-start;color:var(--mut);font-size:13px;font-family:monospace}
.r{align-self:center;background:#4a3a12;color:#ffd479;border-radius:12px;padding:8px 12px}
.e{align-self:center;color:var(--bad)}
.ap{align-self:stretch;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:10px}
.ap pre{margin:6px 0;white-space:pre-wrap;word-break:break-all;font-size:13px;color:var(--mut)}
.ap button{margin-right:8px}
#bar{display:flex;gap:6px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--card)}
#bar input[type=text]{flex:1;min-width:0;padding:12px;border-radius:20px;border:0;background:var(--bg);color:var(--fg);font-size:16px}
button{border:0;border-radius:20px;padding:10px 14px;background:var(--acc);color:#000;font-size:16px}
button.g{background:#2a2e38;color:var(--fg)}
button.no{background:var(--bad)}
button.yes{background:var(--ok)}
#st{font-size:12px;color:var(--mut);padding:4px 12px}
</style>
</head>
<body>
<div id="st">connecting…</div>
<div id="log"></div>
<div id="bar">
  <button class="g" id="cam" title="Photo">📷</button>
  <button class="g" id="mic" title="Voice">🎤</button>
  <input type="text" id="in" placeholder="Kuch bolo…" autocomplete="off">
  <button id="go">➤</button>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<script>
const $ = id => document.getElementById(id);
const log = $("log"), inp = $("in");
let ws, imgData = null, thinking = null, tts = false;
let token = localStorage.getItem("tok") || prompt("Access token:") || "";
localStorage.setItem("tok", token);

function add(cls, text){
  const d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function setThinking(on){
  if (thinking){ thinking.remove(); thinking = null; }
  if (on) thinking = add("t", "soch raha hoon…");
}
function connect(){
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + location.host + "/ws?token=" + encodeURIComponent(token));
  ws.onopen = () => $("st").textContent = "connected";
  ws.onclose = e => {
    if (e.code === 4401){ localStorage.removeItem("tok"); location.reload(); return; }
    $("st").textContent = "disconnected, retrying…"; setTimeout(connect, 2000);
  };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "tool"){
      setThinking(false);
      add("t", "⚙ " + m.name + " " + JSON.stringify(m.input).slice(0, 140));
      setThinking(true);
    } else if (m.type === "approve"){
      setThinking(false); approvalCard(m); 
    } else if (m.type === "reply"){
      setThinking(false); add("a", m.text);
      if (tts && "speechSynthesis" in window){
        const u = new SpeechSynthesisUtterance(m.text); u.lang = "hi-IN"; speechSynthesis.speak(u);
      }
    } else if (m.type === "reminder"){
      add("r", "⏰ " + m.text);
    } else if (m.type === "error"){
      setThinking(false); add("e", m.text);
    }
  };
}
function approvalCard(m){
  const d = document.createElement("div"); d.className = "ap";
  const h = document.createElement("div"); h.textContent = "Permission chahiye: " + m.name;
  const p = document.createElement("pre"); p.textContent = JSON.stringify(m.input, null, 2);
  const y = document.createElement("button"); y.className = "yes"; y.textContent = "Allow";
  const n = document.createElement("button"); n.className = "no"; n.textContent = "Deny";
  const done = ok => {
    ws.send(JSON.stringify({type: "approval", id: m.id, ok}));
    d.remove(); add("t", (ok ? "✔ allowed " : "✖ denied ") + m.name); setThinking(true);
  };
  y.onclick = () => done(true); n.onclick = () => done(false);
  d.append(h, p, y, n); log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function send(){
  const text = inp.value.trim();
  if (!text && !imgData) return;
  if (!ws || ws.readyState !== 1){ add("e", "Server se connect nahi hai."); return; }
  add("u", (imgData ? "📎 " : "") + text);
  ws.send(JSON.stringify({type: "chat", text, image: imgData}));
  inp.value = ""; imgData = null; $("cam").textContent = "📷"; setThinking(true);
}
$("go").onclick = send;
inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

// Camera / gallery (no secure-context needed)
$("cam").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const bmp = await createImageBitmap(f);
  const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = bmp.width * s; c.height = bmp.height * s;
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  imgData = c.toDataURL("image/jpeg", 0.8); $("cam").textContent = "✅"; e.target.value = "";
};

// Voice (Chrome on Android; HTTPS chahiye)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("mic").onclick = () => {
  if (!SR){ add("e", "Is browser me voice input nahi hai."); return; }
  tts = true;
  const r = new SR(); r.lang = "hi-IN"; r.interimResults = false;
  r.onresult = ev => { inp.value = ev.results[0][0].transcript; send(); };
  r.onerror = ev => add("e", "Mic error: " + ev.error);
  r.start();
};
connect();
</script>
</body>
  </html>
