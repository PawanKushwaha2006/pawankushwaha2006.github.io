<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Video Share - 30 Files Tak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef1f8;--card:#fff;--ink:#1b2340;--muted:#6b7394;--accent:#3b4bdb;--accent-d:#2f3cb5;--ok:#1e9e6a;--err:#d6455d;--line:#d5dbee}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:20px;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .box{width:100%;max-width:520px;height:fit-content;background:var(--card);border-radius:20px;padding:26px 20px;box-shadow:0 12px 40px rgba(27,35,64,.12)}
  h1{font-size:1.35rem;margin:0 0 4px}
  .sub{margin:0 0 18px;color:var(--muted);font-size:.9rem}
  .drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;cursor:pointer;transition:.2s}
  .drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent);background:#f5f6ff}
  .drop strong{display:block;font-weight:600}
  .drop span{color:var(--muted);font-size:.83rem}
  .drop input{position:absolute;width:1px;height:1px;opacity:0}
  button{font:inherit;font-weight:600;width:100%;margin-top:10px;padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;transition:background .2s,transform .1s}
  button:hover:not(:disabled){background:var(--accent-d)}
  button:active:not(:disabled){transform:scale(.98)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:#eaedfb;color:var(--accent-d)}
  button.ghost:hover:not(:disabled){background:#dde2f8}
  button:focus-visible,a:focus-visible{outline:3px solid #9aa4ff;outline-offset:2px}
  .head{display:none;justify-content:space-between;align-items:center;margin-top:16px;font-size:.88rem;color:var(--muted)}
  .head a{color:var(--err);cursor:pointer;font-weight:600}
  #list{list-style:none;margin:8px 0 0;padding:0;max-height:340px;overflow-y:auto}
  #list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .th{flex:none;width:46px;height:46px;border-radius:10px;background:#dfe3f4 center/cover;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
  .info{flex:1;min-width:0}
  .name{font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st{font-size:.76rem;color:var(--muted)}
  .st.ok{color:var(--ok)} .st.err{color:var(--err)}
  .st a{color:var(--ok);word-break:break-all}
  .x{flex:none;width:30px;margin:0;padding:4px;background:none;color:var(--muted);font-size:1.1rem}
  .bar{display:none;height:8px;margin-top:14px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #status{min-height:1.3em;margin:10px 0 0;font-size:.9rem;color:var(--muted)}
  #status.ok{color:var(--ok)} #status.err{color:var(--err)}
  #done{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#eefaf4;border:1px solid #bfe8d3}
  #done b{display:block}
  #note{margin:8px 0 0;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <h1>📸 Photo / Video Share Karo</h1>
  <p class="sub">Ek saath 30 tak photos ya videos chuno aur sabka link pao.</p>

  <label class="drop" id="drop">
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    <strong>Yahan tap karo ya files kheench ke daalo</strong>
    <span>Max 30 files, har file max 100 MB</span>
  </label>

  <div class="head" id="head"><span id="count"></span><a id="clear" role="button" tabindex="0">Sab hatao</a></div>
  <ul id="list"></ul>

  <button id="uploadBtn" disabled>Upload karke links banao</button>
  <button id="directBtn" class="ghost" style="display:none">📤 Seedha share karo (bina upload)</button>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="done">
    <b>Links ready hain 👇</b>
    <button id="copyAll">🔗 Sab links copy karo</button>
    <button id="shareAll" class="ghost" style="display:none">📤 Sab links share karo</button>
    <p id="note"></p>
  </section>
</main>

<script>
const MAX_FILES = 30, MAX_MB = 100;
const $ = id => document.getElementById(id);
let items = [];      // {id, file, link, state}
let busy = false, uid = 0;

const setStatus = (m, t = "") => { $("status").textContent = m; $("status").className = t; };

// ---------- File chuna ----------
function addFiles(fileList){
  if(busy) return;
  let skipped = 0, tooBig = 0, full = 0;
  for(const f of fileList){
    if(!/^(image|video)\//.test(f.type)){ skipped++; continue; }
    if(f.size > MAX_MB * 1048576){ tooBig++; continue; }
    if(items.some(i => i.file.name === f.name && i.file.size === f.size && i.file.lastModified === f.lastModified)) continue;
    if(items.length >= MAX_FILES){ full++; continue; }
    items.push({ id: ++uid, file: f, link: "", state: "wait" });
  }
  const msgs = [];
  if(full) msgs.push(`${full} file chhod di (max ${MAX_FILES})`);
  if(tooBig) msgs.push(`${tooBig} file ${MAX_MB} MB se badi`);
  if(skipped) msgs.push(`${skipped} file photo/video nahi`);
  setStatus(msgs.join(", "), msgs.length ? "err" : "");
  $("done").style.display = "none";
  render();
}

function render(){
  const list = $("list"); list.innerHTML = "";
  items.forEach(it => {
    const li = document.createElement("li");
    const th = document.createElement("div"); th.className = "th";
    if(it.file.type.startsWith("image")){
      it.url = it.url || URL.createObjectURL(it.file);
      th.style.backgroundImage = `url("${it.url}")`;
    } else th.textContent = "🎬";
    const info = document.createElement("div"); info.className = "info";
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = it.file.name;
    const st = document.createElement("div"); st.className = "st"; st.id = "st" + it.id;
    info.append(nm, st);
    li.append(th, info);
    if(!busy){
      const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.title = "Hatao";
      x.onclick = () => { items = items.filter(i => i !== it); render(); };
      li.append(x);
    }
    list.append(li);
    paintState(it);
  });
  const n = items.length;
  $("head").style.display = n ? "flex" : "none";
  $("count").textContent = `${n} / ${MAX_FILES} files chuni`;
  $("uploadBtn").disabled = busy || !n;
  $("directBtn").style.display = (n && navigator.canShare) ? "block" : "none";
}

function paintState(it){
  const st = $("st" + it.id); if(!st) return;
  const mb = (it.file.size / 1048576).toFixed(1) + " MB";
  st.className = "st";
  if(it.state === "wait") st.textContent = mb;
  else if(it.state === "up"){ st.textContent = (it.pct || 0) + "% upload ho raha hai…"; }
  else if(it.state === "ok"){
    st.className = "st ok"; st.textContent = "";
    const a = document.createElement("a"); a.href = it.link; a.target = "_blank"; a.rel = "noopener"; a.textContent = "✅ " + it.link;
    st.append(a);
  } else { st.className = "st err"; st.textContent = "❌ Fail hua"; }
}

$("fileInput").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
$("clear").onclick = () => { if(!busy){ items = []; $("done").style.display = "none"; setStatus(""); render(); } };
const drop = $("drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

// ---------- Upload ----------
function xhrUpload(url, f, onProgress){
  return new Promise((resolve, reject) => {
    const fd = new FormData(); fd.append("file", f);
    const x = new XMLHttpRequest();
    x.open("POST", url);
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => { try{ resolve(JSON.parse(x.responseText)); }catch{ reject(new Error("bad")); } };
    x.onerror = () => reject(new Error("net"));
    x.send(fd);
  });
}
const providers = [
  { name: "tmpfiles", note: "Links kuch der (~1 ghanta) tak chalenge, jaldi bhej do.",
    async run(f, p){
      const d = await xhrUpload("https://tmpfiles.org/api/v1/upload", f, p);
      if(d.status !== "success") throw 0;
      return d.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/").replace("http://", "https://");
    } },
  { name: "file.io", note: "file.io ke link ek hi baar download hote hain.",
    async run(f, p){
      const d = await xhrUpload("https://file.io/?expires=1w", f, p);
      if(!d.success) throw 0;
      return d.link;
    } }
];
const usedNotes = new Set();

async function uploadOne(it){
  it.state = "up"; it.pct = 0; paintState(it);
  for(const p of providers){
    try{
      it.link = await p.run(it.file, r => { it.pct = Math.round(r * 100); paintState(it); });
      it.state = "ok"; usedNotes.add(p.note); paintState(it); return;
    }catch(e){}
  }
  it.state = "err"; paintState(it);
}

$("uploadBtn").onclick = async () => {
  busy = true; usedNotes.clear();
  items.forEach(i => { if(i.state !== "ok") i.state = "wait"; });
  render();
  $("uploadBtn").disabled = true;
  $("bar").style.display = "block"; $("done").style.display = "none";
  const queue = items.filter(i => i.state !== "ok");
  let finished = items.length - queue.length;
  const tick = () => { $("barFill").style.width = Math.round(finished / items.length * 100) + "%";
                       setStatus(`${finished} / ${items.length} upload ho gayi… ⏳`); };
  tick();
  // 3 files ek saath upload hoti hain
  const worker = async () => { while(queue.length){ const it = queue.shift(); await uploadOne(it); finished++; tick(); } };
  await Promise.all([worker(), worker(), worker()]);

  busy = false; render();
  const ok = items.filter(i => i.state === "ok"), bad = items.length - ok.length;
  setStatus(bad ? `${ok.length} ho gayi, ${bad} fail. Dobara dabao, sirf fail wali retry hongi.` : "Sab ho gaya! ✅", bad ? "err" : "ok");
  if(ok.length){
    $("note").textContent = [...usedNotes].join(" ");
    $("shareAll").style.display = navigator.share ? "block" : "none";
    $("done").style.display = "block";
  }
  $("uploadBtn").textContent = bad ? "Fail wali dobara try karo" : "Upload karke links banao";
};

// ---------- Links copy / share ----------
const allLinks = () => items.filter(i => i.state === "ok").map(i => i.link).join("\n");
$("copyAll").onclick = async () => {
  try{ await navigator.clipboard.writeText(allLinks()); setStatus("Sab links copy ho gaye! Ab WhatsApp pe paste karo 👍", "ok"); }
  catch{ setStatus("Copy nahi hua.", "err"); }
};
$("shareAll").onclick = () => navigator.share({ text: allLinks() }).catch(() => {});

// ---------- Seedha share (bina upload, phone par) ----------
$("directBtn").onclick = async () => {
  const files = items.map(i => i.file);
  try{
    if(!navigator.canShare({ files })) throw 0;
    await navigator.share({ files });
  }catch(e){
    if(e && e.name === "AbortError") return;
    setStatus("Is device par seedha share nahi ho paya. Upload wala option use karo.", "err");
  }
};
render();
</script>
</body>
</html>
