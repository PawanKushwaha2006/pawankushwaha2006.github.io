<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Video Share - Ek Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{--bg:#eef1f8;--card:#fff;--ink:#1b2340;--muted:#6b7394;--accent:#3b4bdb;--accent-d:#2f3cb5;--ok:#1e9e6a;--err:#d6455d;--line:#d5dbee}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:20px;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .box{width:100%;max-width:520px;height:fit-content;background:var(--card);border-radius:20px;padding:26px 20px;box-shadow:0 12px 40px rgba(27,35,64,.12)}
  h1{font-size:1.35rem;margin:0 0 4px}
  .sub{margin:0 0 18px;color:var(--muted);font-size:.9rem}
  .drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;cursor:pointer;transition:.2s}
  .drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent);background:#f5f6ff}
  .drop strong{display:block;font-weight:600}
  .drop span{color:var(--muted);font-size:.83rem}
  .drop input{position:absolute;width:1px;height:1px;opacity:0}
  button{font:inherit;font-weight:600;width:100%;margin-top:10px;padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;transition:background .2s,transform .1s}
  button:hover:not(:disabled){background:var(--accent-d)}
  button:active:not(:disabled){transform:scale(.98)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:#eaedfb;color:var(--accent-d)}
  button.ghost:hover:not(:disabled){background:#dde2f8}
  button:focus-visible,a:focus-visible{outline:3px solid #9aa4ff;outline-offset:2px}
  .head{display:none;justify-content:space-between;align-items:center;margin-top:16px;font-size:.88rem;color:var(--muted)}
  .head a{color:var(--err);cursor:pointer;font-weight:600}
  #list{list-style:none;margin:8px 0 0;padding:0;max-height:300px;overflow-y:auto}
  #list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .th{flex:none;width:46px;height:46px;border-radius:10px;background:#dfe3f4 center/cover;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
  .info{flex:1;min-width:0}
  .name{font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sz{font-size:.76rem;color:var(--muted)}
  .x{flex:none;width:30px;margin:0;padding:4px;background:none;color:var(--muted);font-size:1.1rem}
  .bar{display:none;height:8px;margin-top:14px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #status{min-height:1.3em;margin:10px 0 0;font-size:.9rem;color:var(--muted)}
  #status.ok{color:var(--ok)} #status.err{color:var(--err)}
  #done{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#eefaf4;border:1px solid #bfe8d3}
  #done b{display:block;margin-bottom:6px}
  #shareLink{word-break:break-all;color:var(--ok);font-size:.9rem}
  #note{margin:8px 0 0;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <h1>📸 Photo / Video Share Karo</h1>
  <p class="sub">30 tak files chuno, sabka ek hi link pao.</p>

  <label class="drop" id="drop">
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    <strong>Yahan tap karo ya files kheench ke daalo</strong>
    <span>Max 30 files, sab milake max 100 MB</span>
  </label>

  <div class="head" id="head"><span id="count"></span><a id="clear" role="button" tabindex="0">Sab hatao</a></div>
  <ul id="list"></ul>

  <button id="uploadBtn" disabled>Ek link banao</button>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="done">
    <b>Tera ek link ban gaya 👇</b>
    <a id="shareLink" href="#" target="_blank" rel="noopener"></a>
    <button id="copyBtn">🔗 Link copy karo</button>
    <button id="shareBtn" class="ghost" style="display:none">📤 Link share karo</button>
    <p id="note"></p>
  </section>
</main>

<script>
const MAX_FILES = 30, MAX_TOTAL_MB = 100;
const $ = id => document.getElementById(id);
let items = [], busy = false, uid = 0, finalLink = "";

const setStatus = (m, t = "") => { $("status").textContent = m; $("status").className = t; };
const mb = n => (n / 1048576).toFixed(1) + " MB";
const total = () => items.reduce((s, i) => s + i.file.size, 0);

function addFiles(fileList){
  if(busy) return;
  let bad = 0, full = 0, big = 0;
  for(const f of fileList){
    if(!/^(image|video)\//.test(f.type)){ bad++; continue; }
    if(items.some(i => i.file.name === f.name && i.file.size === f.size && i.file.lastModified === f.lastModified)) continue;
    if(items.length >= MAX_FILES){ full++; continue; }
    if(total() + f.size > MAX_TOTAL_MB * 1048576){ big++; continue; }
    items.push({ id: ++uid, file: f });
  }
  const m = [];
  if(full) m.push(`${full} file chhod di (max ${MAX_FILES})`);
  if(big) m.push(`${big} file chhod di (total ${MAX_TOTAL_MB} MB se zyada)`);
  if(bad) m.push(`${bad} file photo/video nahi`);
  setStatus(m.join(", "), m.length ? "err" : "");
  $("done").style.display = "none";
  render();
}

function render(){
  const list = $("list"); list.innerHTML = "";
  items.forEach(it => {
    const li = document.createElement("li");
    const th = document.createElement("div"); th.className = "th";
    if(it.file.type.startsWith("image")){
      it.url = it.url || URL.createObjectURL(it.file);
      th.style.backgroundImage = `url("${it.url}")`;
    } else th.textContent = "🎬";
    const info = document.createElement("div"); info.className = "info";
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = it.file.name;
    const sz = document.createElement("div"); sz.className = "sz"; sz.textContent = mb(it.file.size);
    info.append(nm, sz); li.append(th, info);
    if(!busy){
      const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.title = "Hatao";
      x.onclick = () => { items = items.filter(i => i !== it); render(); };
      li.append(x);
    }
    list.append(li);
  });
  const n = items.length;
  $("head").style.display = n ? "flex" : "none";
  $("count").textContent = `${n} / ${MAX_FILES} files · ${mb(total())} / ${MAX_TOTAL_MB} MB`;
  $("uploadBtn").disabled = busy || !n;
}

$("fileInput").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
$("clear").onclick = () => { if(!busy){ items = []; $("done").style.display = "none"; setStatus(""); render(); } };
const drop = $("drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

// ---- Upload (ek hi zip file) ----
function xhrUpload(url, blob, name, onProgress){
  return new Promise((resolve, reject) => {
    const fd = new FormData(); fd.append("file", blob, name);
    const x = new XMLHttpRequest();
    x.open("POST", url);
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => { try{ resolve(JSON.parse(x.responseText)); }catch{ reject(new Error("bad")); } };
    x.onerror = () => reject(new Error("net"));
    x.send(fd);
  });
}
const providers = [
  { note: "Ye link lagbhag 1 ghante tak chalega. Kholne par ek ZIP download hogi jisme saari photos/videos hongi.",
    async run(b, n, p){
      const d = await xhrUpload("https://tmpfiles.org/api/v1/upload", b, n, p);
      if(d.status !== "success") throw 0;
      return d.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/").replace("http://", "https://");
    } },
  { note: "Ye link ek hi baar download hota hai (file.io). Kholne par ZIP download hogi.",
    async run(b, n, p){
      const d = await xhrUpload("https://file.io/?expires=1w", b, n, p);
      if(!d.success) throw 0;
      return d.link;
    } }
];

$("uploadBtn").onclick = async () => {
  if(!items.length) return;
  if(typeof JSZip === "undefined"){ setStatus("ZIP library load nahi hui. Internet check karke page refresh karo.", "err"); return; }
  busy = true; render();
  $("done").style.display = "none"; $("bar").style.display = "block"; $("barFill").style.width = "0";
  try{
    // Step 1: sab files ko ek ZIP mein daalo (compress nahi, jaldi banta hai)
    setStatus("Files ek saath pack ho rahi hain… 📦");
    const zip = new JSZip(), used = new Set();
    items.forEach((it, i) => {
      let n = it.file.name; if(used.has(n)) n = `${i + 1}_${n}`; used.add(n);
      zip.file(n, it.file);
    });
    const blob = await zip.generateAsync({ type: "blob", compression: "STORE" },
      m => { $("barFill").style.width = Math.round(m.percent * 0.3) + "%"; });

    // Step 2: ek hi file upload
    let ok = false;
    for(const p of providers){
      try{
        setStatus("Upload ho raha hai… ⏳");
        finalLink = await p.run(blob, "photos-videos.zip", r => {
          $("barFill").style.width = Math.round(30 + r * 70) + "%";
          setStatus(`Upload ho raha hai… ${Math.round(r * 100)}% ⏳`);
        });
        $("note").textContent = p.note; ok = true; break;
      }catch(e){}
    }
    if(!ok) throw new Error("upload");
    $("barFill").style.width = "100%";
    $("shareLink").href = finalLink; $("shareLink").textContent = finalLink;
    $("shareBtn").style.display = navigator.share ? "block" : "none";
    $("done").style.display = "block";
    setStatus("Ho gaya! ✅", "ok");
  }catch(e){
    $("bar").style.display = "none";
    setStatus("Fail hua. Internet check karo, files kam karo aur dobara try karo.", "err");
  }
  busy = false; render();
};

$("copyBtn").onclick = async () => {
  try{ await navigator.clipboard.writeText(finalLink); setStatus("Link copy ho gaya! Ab WhatsApp pe bhej do 👍", "ok"); }
  catch{ setStatus("Copy nahi hua, link dabake copy karo.", "err"); }
};
$("shareBtn").onclick = () => navigator.share({ title: "Meri photos aur videos", url: finalLink }).catch(() => {});
render();
</script>
</body>
  </html>
