<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>C Programming Language — Complete Reference</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #17171f;
      --border: #2a2a38;
      --accent: #00e5ff;
      --accent2: #ff6b35;
      --accent3: #7fff00;
      --text: #e8e8f0;
      --muted: #7a7a9a;
      --code-bg: #0d0d15;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* NOISE TEXTURE OVERLAY */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* HERO */
    header {
      position: relative;
      padding: 80px 60px 60px;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    header::after {
      content: 'C';
      position: absolute;
      right: -20px;
      top: -40px;
      font-family: 'Space Mono', monospace;
      font-size: 280px;
      font-weight: 700;
      color: rgba(0,229,255,0.04);
      line-height: 1;
      pointer-events: none;
      animation: floatBg 8s ease-in-out infinite;
    }
    @keyframes floatBg {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .hero-tag {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 12px;
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease forwards;
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(36px, 6vw, 72px);
      font-weight: 700;
      line-height: 1.1;
      animation: fadeUp 0.6s 0.1s ease both;
    }
    h1 span { color: var(--accent); }

    .hero-sub {
      margin-top: 16px;
      font-size: 16px;
      color: var(--muted);
      max-width: 560px;
      animation: fadeUp 0.6s 0.2s ease both;
    }

    .hero-meta {
      display: flex;
      gap: 32px;
      margin-top: 36px;
      flex-wrap: wrap;
      animation: fadeUp 0.6s 0.3s ease both;
    }
    .meta-item { display: flex; flex-direction: column; gap: 4px; }
    .meta-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: 'Space Mono', monospace; }
    .meta-value { font-family: 'Space Mono', monospace; font-size: 14px; color: var(--accent3); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* LAYOUT */
    main {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    /* SIDEBAR NAV */
    nav {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      padding: 40px 0;
      background: var(--surface);
    }
    nav::-webkit-scrollbar { width: 4px; }
    nav::-webkit-scrollbar-track { background: transparent; }
    nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .nav-section { margin-bottom: 8px; }
    .nav-title {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 24px 4px;
    }
    nav a {
      display: block;
      padding: 7px 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      transition: all 0.2s;
      border-left: 2px solid transparent;
      position: relative;
    }
    nav a:hover {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(0,229,255,0.04);
    }

    /* CONTENT */
    .content {
      padding: 60px;
      max-width: 900px;
    }

    section { margin-bottom: 72px; animation: fadeUp 0.5s ease both; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .section-num {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      border: 1px solid rgba(0,229,255,0.3);
      padding: 3px 8px;
      min-width: 36px;
      text-align: center;
    }

    h2 {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    h3 {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent2);
      margin: 28px 0 12px;
    }

    p { color: #b0b0c8; font-size: 15px; margin-bottom: 16px; }

    /* CODE BLOCKS */
    .code-block {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 2px;
      padding: 24px;
      margin: 20px 0;
      position: relative;
      overflow-x: auto;
    }
    .code-block::before {
      content: attr(data-lang);
      position: absolute;
      top: 8px;
      right: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    pre {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      line-height: 1.8;
      color: #c8c8e8;
      white-space: pre;
    }

    /* SYNTAX HIGHLIGHTING */
    .kw  { color: #00e5ff; }   /* keywords */
    .fn  { color: #7fff00; }   /* functions */
    .str { color: #ffd700; }   /* strings */
    .num { color: #ff6b35; }   /* numbers */
    .cm  { color: #4a4a6a; font-style: italic; }  /* comments */
    .pp  { color: #c77dff; }   /* preprocessor */
    .tp  { color: #ff9f9f; }   /* types */

    /* CARDS */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 20px;
      transition: all 0.25s;
      cursor: default;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,229,255,0.08);
    }
    .card-icon { font-size: 22px; margin-bottom: 10px; }
    .card-title { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

    /* TABLES */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 13px;
    }
    th {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      text-align: left;
    }
    td {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(42,42,56,0.5);
      color: #b0b0c8;
      font-size: 13px;
    }
    tr:hover td { background: rgba(0,229,255,0.03); }
    td code, p code {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      background: var(--code-bg);
      color: var(--accent3);
      padding: 2px 6px;
      border: 1px solid var(--border);
    }

    /* CALLOUT */
    .callout {
      border-left: 3px solid var(--accent2);
      background: rgba(255,107,53,0.06);
      padding: 16px 20px;
      margin: 20px 0;
      font-size: 14px;
      color: #c8b8a8;
    }
    .callout strong { color: var(--accent2); font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 6px; }

    /* DIVIDER */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 48px 0;
    }

    /* TAGS */
    .tag {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      padding: 3px 8px;
      border: 1px solid;
      margin: 3px;
    }
    .tag-blue { border-color: var(--accent); color: var(--accent); }
    .tag-orange { border-color: var(--accent2); color: var(--accent2); }
    .tag-green { border-color: var(--accent3); color: var(--accent3); }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    footer p { color: var(--muted); font-size: 12px; margin: 0; font-family: 'Space Mono', monospace; }

    @media (max-width: 768px) {
      header { padding: 50px 24px 40px; }
      main { grid-template-columns: 1fr; }
      nav { display: none; }
      .content { padding: 32px 24px; }
      footer { padding: 32px 24px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>

      <p>A pointer is a variable that stores the <em>memory address</em> of another variable. Pointers are one of C's most powerful (and tricky) features.</p>

<span class="fn">printf</span>(<span class="str">"%p\n"</span>, ptr);  <span class="cm">// → 0x... (address of x)</span>
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, *ptr); <span class="cm">// → 42    (dereference)</span>

<span class="cm">// Modify value through pointer</span>

<span class="fn">printf</span>(<span class="str">"%d\n"</span>, x);   <span class="cm">// → 100  (x is now 100)</span>

<span class="tp">int</span> *p = arr;
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, *(p + <span class="num">1</span>));  <span class="cm">// → 2</span></pre>

.add-btn:hover { color: #007acc; }

  #editor { flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; outline: none; padding: 15px; font-family: 'Fira Code', monospace; font-size: 14px; resize: none; }

  #stdin, #output { background: #1e1e1e; color: #d4d4d4; border: none; outline: none; padding: 15px; font-family: 'Fira Code', monospace; font-size: 14px; resize: none; height: 100%; width: 100%; }
  #output.error { color: #f48771; }
.header { background: #252526; padding: 8px 15px; font-size: 12px; color: #999; text-transform: uppercase; }

.gutter { background: #3e3e3e; }
.gutter:hover { background: #007acc; }
.gutter.gutter-horizontal { cursor: col-resize; }
.gutter.gutter-vertical { cursor: row-resize; }
</style>
</head>
<body>

<div class="topbar">
  <div>C Compiler</div>
  <div>
    <select id="lang">
      <option value="c" selected>C</option>
      <option value="cpp">C++</option>
      <option value="python3">PYTHON</option>
      <option value="java">JAVA</option>
    </select>
    <button class="btn" id="run-btn">RUN ▶</button>
  </div>
</div>

<div class="file-tabs" id="file-tabs"></div>

<div class="main" id="split-main">
  <textarea id="editor" spellcheck="false"></textarea>
  <div id="split-right">
    <div id="stdin-box" style="display: flex; flex-direction: column; height: 100%;">
      <div class="header">STDIN</div>
      <textarea id="stdin" placeholder="Input here..."></textarea>
    </div>
    <div id="output-box" style="display: flex; flex-direction: column; height: 100%;">
      <div class="header">Output</div>
      <div id="output">Click RUN to see output</div>
    </div>
  </div>
</div>

<script>
Split(['#editor', '#split-right'], { sizes: [55, 45], minSize: 300, gutterSize: 4 });
Split(['#stdin-box', '#output-box'], { direction: 'vertical', sizes: [45, 55], minSize: 100, gutterSize: 4 });

// C Default
let files = { 'main.c': '#include <stdio.h>\n\nint main() {\n printf("Hello World\\n");\n return 0;\n}' };
let currentFile = 'main.c';
let currentLang = 'c';
const MAX_FILES = 101;

const editor = document.getElementById('editor');
const fileTabs = document.getElementById('file-tabs');
const runBtn = document.getElementById('run-btn');
const lang = document.getElementById('lang');
const stdin = document.getElementById('stdin');
const output = document.getElementById('output');

function saveFile() {
    files[currentFile] = editor.value;
}

function getExt(lang) {
    return { python3: '.py', c: '.c', cpp: '.cpp', java: '.java' }[lang];
}

function getDefaultCode(lang, filename) {
    const className = filename.replace('.java', '');
    return {
        python3: 'print("Hello World")',
        c: '#include <stdio.h>\n\nint main() {\n printf("Hello World\\n");\n return 0;\n}',
        cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n cout << "Hello World" << endl;\n return 0;\n}',
        java: `public class ${className} {\n public static void main(String[] args) {\n System.out.println("Hello World");\n }\n}`
    }[lang];
}

function renderTabs() {
    const keys = Object.keys(files);
    fileTabs.innerHTML = keys.map(name => `
        <div class="file-tab ${name === currentFile? 'active' : ''}" data-name="${name}">
            <span class="tab-name">${name}</span>
            ${keys.length > 1? '<span class="close-btn">&times;</span>' : ''}
        </div>
    `).join('') + (keys.length < MAX_FILES? '<button class="add-btn" title="New File">+</button>' : '');
}

fileTabs.onclick = (e) => {
    const tab = e.target.closest('.file-tab');
    if (!tab) {
        if (e.target.classList.contains('add-btn')) addFile();
        return;
    }

    const name = tab.dataset.name;
    if (e.target.classList.contains('close-btn')) {
        e.stopPropagation();
        deleteFile(name);
    } else {
        if (e.detail === 1) openFile(name);
    }
};

fileTabs.ondblclick = (e) => {
    if (e.target.classList.contains('tab-name')) {
        const tab = e.target.closest('.file-tab');
        renameFile(tab.dataset.name, e.target);
    }
};

function openFile(name) {
    saveFile();
    currentFile = name;
    editor.value = files[name];
    renderTabs();
}

function deleteFile(name) {
    if (Object.keys(files).length === 1) return;
    saveFile();
    delete files[name];
    if (currentFile === name) {
        currentFile = Object.keys(files)[0];
        editor.value = files[currentFile];
    }
    renderTabs();
}

function addFile() {
    if (Object.keys(files).length >= MAX_FILES) {
        alert(`Max ${MAX_FILES} files allowed`);
        return;
    }
    saveFile();
    const ext = getExt(currentLang);
    let i = 1;
    let name = `file${i}${ext}`;
    while (files[name]) name = `file${++i}${ext}`;

    const code = getDefaultCode(currentLang, name);
    files[name] = code;
    openFile(name);
}

function renameFile(oldName, span) {
    const input = document.createElement('input');
    input.value = oldName;
    span.replaceWith(input);
    input.focus();
    input.select();

    const finish = (save) => {
        if (!save) {
            renderTabs();
            return;
        }
        const newName = input.value.trim();
        const ext = getExt(currentLang);

        if (!newName.endsWith(ext)) {
            alert(`File must end with ${ext}`);
            renderTabs();
            return;
        }

        if (currentLang === 'java') {
            const className = newName.replace('.java', '');
            if (!/^[A-Z][a-zA-Z0-9]*$/.test(className)) {
                alert('Java file name must start with uppercase and be valid class name');
                renderTabs();
                return;
            }
        }

        if (newName && newName!== oldName && files[newName] === undefined) {
            files[newName] = files[oldName];
            delete files[oldName];
            if (currentFile === oldName) currentFile = newName;
        }
        renderTabs();
    };

    input.onblur = () => finish(true);
    input.onkeydown = e => {
        if (e.key === 'Enter') finish(true);
        if (e.key === 'Escape') finish(false);
    };
}

lang.onchange = () => {
    saveFile();
    const oldLang = currentLang;
    currentLang = lang.value;

    const oldExt = getExt(oldLang);
    const newExt = getExt(currentLang);

    if (oldExt!== newExt) {
        if (!confirm('Language change karne se file extensions change hongi. Continue?')) {
            lang.value = oldLang;
            currentLang = oldLang;
            return;
        }
        const newFiles = {};
        for (let name in files) {
            const baseName = name.replace(oldExt, '');
            newFiles[baseName + newExt] = files[name];
        }
        files = newFiles;
        currentFile = currentFile.replace(oldExt, newExt);
        editor.value = files[currentFile];
        renderTabs();
    }
};

editor.oninput = saveFile;

runBtn.onclick = async () => {
    saveFile();
    runBtn.disabled = true;
    runBtn.textContent = 'RUNNING...';
    output.textContent = 'Running...';
    output.className = '';

    try {
        const res = await fetch('https://emkc.org/api/v2/piston/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                language: currentLang,
                version: '*',
                files: Object.entries(files).map(([name, content]) => ({ name, content })),
                stdin: stdin.value
            })
        });
        const data = await res.json();
        const result = data.compile?.stderr || data.run?.stderr || data.run?.stdout || 'No output';
        output.textContent = result;
        if (data.compile?.stderr || data.run?.stderr) output.className = 'error';
    } catch (e) {
        output.textContent = 'Error: ' + e.message;
        output.className = 'error';
    }

    runBtn.disabled = false;
    runBtn.textContent = 'RUN ▶';
};

// Init
editor.value = files[currentFile];
renderTabs();
</script>

</body>
</html>
