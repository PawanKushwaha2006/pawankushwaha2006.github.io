
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f5f9;
  min-height: 100vh;
  padding: 25px 15px;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  color: #ff6b35;
  font-size: 32px;
}

.header p {
  color: #777;
  margin-top: 8px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 5px 25px #0000000c;
}

.input-area {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 9px;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #ff6b35;
}

button {
  border: none;
  cursor: pointer;
  border-radius: 8px;
  font-weight: bold;
}

.add-btn {
  background: #ff6b35;
  color: white;
  padding: 0 20px;
  font-size: 15px;
}

.add-btn:hover {
  background: #e95723;
}

.stats {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 22px 0;
  text-align: center;
}

.stat {
  background: #fff3ed;
  flex: 1;
  padding: 13px 5px;
  border-radius: 10px;
}

.stat h2 {
  color: #ff6b35;
  font-size: 22px;
}

.stat p {
  color: #777;
  font-size: 12px;
  margin-top: 5px;
}

.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

.filter-btn {
  padding: 9px 14px;
  background: #f1f1f1;
  color: #555;
}

.filter-btn.active {
  background: #ff6b35;
  color: white;
}

.task-list {
  list-style: none;
}

.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 5px;
  border-bottom: 1px solid #eee;
}

.task input[type="checkbox"] {
  flex: none;
  width: 18px;
  height: 18px;
  accent-color: #ff6b35;
  cursor: pointer;
}

.task-text {
  flex: 1;
  overflow-wrap: anywhere;
  font-size: 15px;
}

.task.completed .task-text {
  text-decoration: line-through;
  color: #aaa;
}

.actions {
  display: flex;
  gap: 6px;
}

.actions button {
  padding: 7px 9px;
  background: #f2f2f2;
  font-size: 13px;
}

.actions .delete {
  color: #e53935;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 30px 5px;
  display: none;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
  gap: 10px;
  color: #888;
  font-size: 13px;
}

.clear-btn {
  color: #e53935;
  background: transparent;
  padding: 8px;
}

@media(max-width:450px) {
  .card {
    padding: 15px;
  }

  .header h1 {
    font-size: 27px;
  }

  .add-btn {
    padding: 0 13px;
  }

  .actions {
    gap: 4px;
  }

  .actions button {
    padding: 7px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>My To-Do List</h1>
    <p>Organize your day, one task at a time.</p>
  </div>

  <div class="card">

    <div class="input-area">
      <input
        type="text"
        id="taskInput"
        placeholder="What needs to be done?"
      >
      <button class="add-btn" onclick="addTask()">+ Add</button>
    </div>

    <div class="stats">
      <div class="stat">
        <h2 id="totalCount">0</h2>
        <p>Total Tasks</p>
      </div>

      <div class="stat">
        <h2 id="pendingCount">0</h2>
        <p>Pending</p>
      </div>

      <div class="stat">
        <h2 id="completedCount">0</h2>
        <p>Completed</p>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('active',this)">Active</button>
      <button class="filter-btn" onclick="setFilter('completed',this)">Completed</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty" id="emptyMessage">
      <h3>No tasks found!</h3>
      <p>Add a new task to get started.</p>
    </div>

    <div class="footer">
      <span id="remainingText">0 tasks left</span>
      <button class="clear-btn" onclick="clearCompleted()">
        Clear Completed
      </button>
    </div>

  </div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("myTasks")) || [];
let currentFilter = "all";

const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");

function saveTasks() {
  localStorage.setItem("myTasks", JSON.stringify(tasks));
}

function addTask() {
  const text = taskInput.value.trim();

  if (!text) {
    alert("Please enter a task!");
    return;
  }

  tasks.push({
    id: Date.now(),
    text: text,
    completed: false
  });

  taskInput.value = "";
  saveTasks();
  renderTasks();
}

taskInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") addTask();
});

function toggleTask(id) {
  tasks = tasks.map(task =>
    task.id === id
      ? {...task, completed: !task.completed}
      : task
  );

  saveTasks();
  renderTasks();
}

function deleteTask(id) {
  if (!confirm("Delete this task?")) return;

  tasks = tasks.filter(task => task.id !== id);

  saveTasks();
  renderTasks();
}

function editTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  const newText = prompt("Edit your task:", task.text);

  if (newText === null) return;

  if (!newText.trim()) {
    alert("Task cannot be empty!");
    return;
  }

  task.text = newText.trim();

  saveTasks();
  renderTasks();
}

function setFilter(filter, button) {
  currentFilter = filter;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
  renderTasks();
}

function clearCompleted() {
  if (!tasks.some(t => t.completed)) {
    alert("No completed tasks!");
    return;
  }

  if (!confirm("Clear all completed tasks?")) return;

  tasks = tasks.filter(t => !t.completed);

  saveTasks();
  renderTasks();
}

function renderTasks() {

  taskList.innerHTML = "";

  let filteredTasks = tasks.filter(task => {
    if (currentFilter === "active") return !task.completed;
    if (currentFilter === "completed") return task.completed;
    return true;
  });

  filteredTasks.forEach(task => {

    const li = document.createElement("li");
    li.className = "task" + (task.completed ? " completed" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.completed;
    checkbox.addEventListener("change", () => toggleTask(task.id));

    const span = document.createElement("span");
    span.className = "task-text";
    span.textContent = task.text;

    const actions = document.createElement("div");
    actions.className = "actions";

    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit";
    editBtn.addEventListener("click", () => editTask(task.id));

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.className = "delete";
    deleteBtn.addEventListener("click", () => deleteTask(task.id));

    actions.append(editBtn, deleteBtn);
    li.append(checkbox, span, actions);

    taskList.appendChild(li);
  });

  document.getElementById("emptyMessage").style.display =
    filteredTasks.length ? "none" : "block";

  const completed = tasks.filter(t => t.completed).length;
  const pending = tasks.length - completed;

  document.getElementById("totalCount").textContent = tasks.length;
  document.getElementById("pendingCount").textContent = pending;
  document.getElementById("completedCount").textContent = completed;

  document.getElementById("remainingText").textContent =
    pending + " tasks left";
}

renderTasks();

</script>

</body>
</html>
