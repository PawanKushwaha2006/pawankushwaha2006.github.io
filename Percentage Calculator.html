
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #151515;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: #222;
    padding: 25px;
    border-radius: 18px;
}

h2 {
    text-align: center;
    color: #ff6b35;
    margin-bottom: 20px;
}

.tabs {
    display: flex;
    gap: 7px;
    margin-bottom: 20px;
}

.tabs button {
    flex: 1;
    padding: 10px 5px;
    background: #444;
    border: none;
    color: white;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
}

.tabs button.active {
    background: #ff6b35;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

label {
    display: block;
    margin: 15px 0 8px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #555;
    border-radius: 9px;
    background: #333;
    color: white;
    font-size: 16px;
    outline: none;
}

.calculate {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 9px;
    background: #ff6b35;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.clear {
    background: #444;
    margin-top: 10px;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 18px;
    background: #333;
    border-radius: 10px;
    text-align: center;
}

.result h3 {
    color: #aaa;
    font-size: 14px;
}

.answer {
    color: #ff6b35;
    font-size: 30px;
    font-weight: bold;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

</style>
</head>

<body>

<div class="container">

<h2>Percentage Calculator</h2>

<div class="tabs">
    <button class="active" onclick="showTab(0,this)">Find %</button>
    <button onclick="showTab(1,this)">Change %</button>
    <button onclick="showTab(2,this)">What %</button>
</div>

<!-- FIND PERCENTAGE -->
<div class="section active">

    <label>Percentage (%)</label>
    <input type="number" id="percent" placeholder="Example: 20">

    <label>Number</label>
    <input type="number" id="number" placeholder="Example: 500">

    <button class="calculate" onclick="findPercentage()">
        Calculate
    </button>

    <div class="result" id="result1">
        <h3>Result</h3>
        <div class="answer" id="answer1"></div>
    </div>

</div>

<!-- PERCENTAGE CHANGE -->
<div class="section">

    <label>Original Value</label>
    <input type="number" id="oldValue" placeholder="Example: 100">

    <label>New Value</label>
    <input type="number" id="newValue" placeholder="Example: 150">

    <button class="calculate" onclick="percentageChange()">
        Calculate
    </button>

    <div class="result" id="result2">
        <h3>Percentage Change</h3>
        <div class="answer" id="answer2"></div>
    </div>

</div>

<!-- WHAT PERCENTAGE -->
<div class="section">

    <label>Value</label>
    <input type="number" id="value" placeholder="Example: 25">

    <label>Total Value</label>
    <input type="number" id="total" placeholder="Example: 100">

    <button class="calculate" onclick="whatPercentage()">
        Calculate
    </button>

    <div class="result" id="result3">
        <h3>Percentage</h3>
        <div class="answer" id="answer3"></div>
    </div>

</div>

</div>

<script>

function showTab(index, button) {

    document.querySelectorAll(".section").forEach(section => {
        section.classList.remove("active");
    });

    document.querySelectorAll(".tabs button").forEach(btn => {
        btn.classList.remove("active");
    });

    document.querySelectorAll(".section")[index].classList.add("active");
    button.classList.add("active");
}

function findPercentage() {

    const p = Number(document.getElementById("percent").value);
    const n = Number(document.getElementById("number").value);

    if (document.getElementById("percent").value === "" ||
        document.getElementById("number").value === "") {
        alert("Please enter both values!");
        return;
    }

    const result = (p / 100) * n;

    document.getElementById("answer1").innerText =
        Number(result.toFixed(10)).toString();

    document.getElementById("result1").style.display = "block";
}

function percentageChange() {

    const oldVal = Number(document.getElementById("oldValue").value);
    const newVal = Number(document.getElementById("newValue").value);

    if (document.getElementById("oldValue").value === "" ||
        document.getElementById("newValue").value === "") {
        alert("Please enter both values!");
        return;
    }

    if (oldVal === 0) {
        alert("Original value cannot be zero!");
        return;
    }

    const change = ((newVal - oldVal) / Math.abs(oldVal)) * 100;

    let text = "";

    if (change > 0) {
        text = "+" + change.toFixed(2) + "% Increase";
    } else if (change < 0) {
        text = change.toFixed(2) + "% Decrease";
    } else {
        text = "No Change (0%)";
    }

    document.getElementById("answer2").innerText = text;
    document.getElementById("result2").style.display = "block";
}

function whatPercentage() {

    const value = Number(document.getElementById("value").value);
    const total = Number(document.getElementById("total").value);

    if (document.getElementById("value").value === "" ||
        document.getElementById("total").value === "") {
        alert("Please enter both values!");
        return;
    }

    if (total === 0) {
        alert("Total value cannot be zero!");
        return;
    }

    const result = (value / total) * 100;

    document.getElementById("answer3").innerText =
        result.toFixed(2) + "%";

    document.getElementById("result3").style.display = "block";
}

</script>

</body>
</html>
